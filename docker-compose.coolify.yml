x-backend-environment: &backend-environment
  LAUNCH_READINESS_ENV: ${LAUNCH_READINESS_ENV:-production}
  NODE_ENV: production
  SALES_AI_API_KEY: ${SALES_AI_API_KEY:-}
  SALES_AI_MODEL: ${SALES_AI_MODEL:-}
  SALES_AI_INPUT_MICRO_USD_PER_MILLION: ${SALES_AI_INPUT_MICRO_USD_PER_MILLION:-0}
  SALES_AI_OUTPUT_MICRO_USD_PER_MILLION: ${SALES_AI_OUTPUT_MICRO_USD_PER_MILLION:-0}
  SALES_AI_TIMEOUT_SECONDS: ${SALES_AI_TIMEOUT_SECONDS:-45}
  PORT: "9000"
  API_PREFIX: /api/v1
  WEB_ORIGIN: ${WEB_ORIGIN:?Set the HTTPS frontend origin}
  PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the HTTPS API origin}
  MONGODB_URI: ${MONGODB_URI:?Set a production MongoDB replica-set URI}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique access secret}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a unique refresh secret}
  REFRESH_COOKIE_SECURE: "true"
  EMAIL_ENABLED: "true"
  ONBOARDING_RECOVERY_ENABLED: ${ONBOARDING_RECOVERY_ENABLED:-false}
  ONBOARDING_RECOVERY_APPROVAL_CASE: ${ONBOARDING_RECOVERY_APPROVAL_CASE:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-RESEND}
  EMAIL_FROM: ${EMAIL_FROM:?Set the verified email sender}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Dapinni}
  EMAIL_SENDING_DOMAIN: ${EMAIL_SENDING_DOMAIN:?Set the verified sending domain}
  EMAIL_DOMAIN_VERIFIED: ${EMAIL_DOMAIN_VERIFIED:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  SMS_PROVIDER: TWILIO
  SMS_FROM: ${SMS_FROM:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  MPESA_ENABLED: ${MPESA_ENABLED:-false}
  MPESA_BASE_URL: ${MPESA_BASE_URL:-https://api.safaricom.co.ke}
  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
  MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-}
  MPESA_PASSKEY: ${MPESA_PASSKEY:-}
  MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
  MPESA_WEBHOOK_SECRET: ${MPESA_WEBHOOK_SECRET:-}
  PAYSTACK_ENABLED: ${PAYSTACK_ENABLED:-false}
  PAYSTACK_BASE_URL: https://api.paystack.co
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
  DOCUMENT_STORAGE_ENABLED: ${DOCUMENT_STORAGE_ENABLED:-false}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  CCTV_ENABLED: ${CCTV_ENABLED:-false}
  CCTV_PROVIDER_BASE_URL: ${CCTV_PROVIDER_BASE_URL:-}
  CCTV_PROVIDER_API_KEY: ${CCTV_PROVIDER_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}

services:
  api:
    build:
      context: ./apps/backend
    environment: *backend-environment
    init: true
    restart: unless-stopped
    expose: ["9000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  worker:
    build:
      context: ./apps/backend
    command: ["node", "dist/jobs-worker.js"]
    environment: *backend-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the HTTPS public API URL including /api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the HTTPS frontend origin}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    init: true
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
