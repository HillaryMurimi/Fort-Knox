name: Enable guarded PR auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Queue GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Do not check out or execute untrusted pull-request content.
          # Only development PRs with exactly one PRO ticket ID qualify.
          node -e '
          const ids=[...new Set(process.env.PR_TITLE.match(/\bPRO-\d+\b/gi)||[])];
          if(ids.length!==1) process.exit(2);
          ' || { echo 'Skipping PR without exactly one PRO issue ID'; exit 0; }
          # GitHub auto-merge waits for required branch rules/checks.
          # This fails closed when auto-merge is disabled or forbidden.
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash
