name: Quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/property-command-center-test
      JWT_ACCESS_SECRET: test-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-thirty-two-characters
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run certify:release

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
      NEXT_PUBLIC_DEV_AUTH_BYPASS: "false"
      NEXT_PUBLIC_DEV_DEMO_MODE: "false"
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install backend browser-fixture dependencies
        run: npm --prefix ../backend ci
      - name: SUPER_ADMIN business browser journey
        env:
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run verify:platform-business
      - name: Pain-first sales and guided-pilot browser journeys
        env:
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run verify:sales-demo
