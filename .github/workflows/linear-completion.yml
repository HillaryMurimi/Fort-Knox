name: Linear completion evidence

on:
  pull_request:
    types: [closed, labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged pull request number to recheck
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  sync:
    # No untrusted PR code is checked out or executed in this privileged job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Sync verified GitHub delivery evidence to Linear
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          EVENT_PATH: ${{ github.event_path }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pull_request }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          async function main() {
            if (!process.env.LINEAR_API_KEY) {
              console.log('LINEAR_API_KEY is not configured. Linear sync skipped.');
              return;
            }
            const [owner, repo] = process.env.GH_REPOSITORY.split('/');
            const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
            const number = process.env.GH_EVENT_NAME === 'workflow_dispatch'
              ? Number(process.env.INPUT_PR) : event.pull_request?.number;
            if (!Number.isSafeInteger(number) || number < 1) throw Error('Invalid PR number');
            async function github(path) {
              const response = await fetch('https://api.github.com' + path, {
                headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
              });
              if (!response.ok) throw Error('GitHub API failed: ' + response.status);
              return response.json();
            }
            async function linear(query, variables) {
              const response = await fetch('https://api.linear.app/graphql', {
                method: 'POST',
                headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
              });
              if (!response.ok) throw Error('Linear API failed: ' + response.status);
              const data = await response.json();
              if (data.errors?.length) throw Error('Linear GraphQL error: ' + data.errors.map(e => e.message).join('; '));
              return data.data;
            }
            const pr = await github('/repos/' + owner + '/' + repo + '/pulls/' + number);
            if (!pr.merged || !pr.merge_commit_sha) {
              console.log('PR is not merged. No Linear updates.');
              return;
            }
            const identifiers = [...new Set(((pr.title || '') + ' ' + (pr.body || '')).match(/\bPRO-\d+\b/gi) || [])];
            if (identifiers.length !== 1) {
              console.log('Expected exactly one PRO issue ID in PR title/body; found ' + identifiers.length);
              return;
            }
            const id = identifiers[0].toUpperCase();
            const issueData = await linear(
              'query($id:String!){issue(id:$id){id identifier team{id states{nodes{id name type}}} comments(first:100){nodes{body}}}}',
              { id }
            );
            const issue = issueData.issue;
            if (!issue || issue.identifier !== id) throw Error('Linked Linear issue not found: ' + id);
            const checks = await github('/repos/' + owner + '/' + repo + '/commits/' + pr.head.sha + '/check-runs?per_page=100');
            const succeeded = (name) => checks.check_runs.some(c => c.name === name && c.status === 'completed' && c.conclusion === 'success' && c.app?.slug === 'github-actions');
            const ciPassed = succeeded('backend') && succeeded('frontend');
            const labels = new Set(pr.labels.map(l => l.name.toLowerCase()));
            const acceptancePassed = labels.has('acceptance-verified');
            const deploymentPassed = labels.has('coolify-verified');
            const ready = ciPassed && acceptancePassed && deploymentPassed;
            const url = 'https://github.com/' + owner + '/' + repo;
            const marker = '[GitHub delivery evidence: ' + url + '/pull/' + number + ']';
            const body = [
              marker,
              'Merged PR: ' + pr.html_url,
              'Merge commit SHA: ' + pr.merge_commit_sha,
              'Merge commit: ' + url + '/commit/' + pr.merge_commit_sha,
              'PR head commit SHA: ' + pr.head.sha,
              'PR head commit: ' + url + '/commit/' + pr.head.sha,
              'Branch: ' + pr.head.ref,
              'Quality CI (backend + frontend): ' + (ciPassed ? 'PASSED' : 'UNVERIFIED / FAILED'),
              'Acceptance criteria: ' + (acceptancePassed ? 'Verified by PR label' : 'Not verified'),
              'Coolify deployment: ' + (deploymentPassed ? 'Verified by PR label' : 'Not verified'),
              'Completion gate: ' + (ready ? 'Eligible for Done' : 'Pending verification'),
              'Note: Labels are human attestations; configure repository controls limiting who can apply them.'
            ].join('\n');
            if (!issue.comments.nodes.some(c => c.body.includes(marker))) {
              await linear('mutation($input:CommentCreateInput!){commentCreate(input:$input){success}}', {
                input: { issueId: issue.id, body }
              });
              console.log('Recorded delivery evidence on ' + id);
            } else {
              console.log('Existing evidence comment found; avoiding duplicate');
            }
            if (ready) {
              const done = issue.team.states.nodes.find(s => s.name === 'Done' && s.type === 'completed');
              if (!done) throw Error('Linear Done state not found');
              await linear('mutation($id:String!,$input:IssueUpdateInput!){issueUpdate(id:$id,input:$input){success}}', {
                id: issue.id, input: { stateId: done.id }
              });
              console.log(id + ' marked Done');
            } else {
              console.log(id + ' remains in its current state pending verification');
            }
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
